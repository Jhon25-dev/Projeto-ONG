<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Voluntário</title>

    <link rel="stylesheet" href="../css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

   <script src="../js/script.js"></script>




</head>

<body>

    <header>
        <h1>Cadastre-se para se tornar um voluntário!</h1>
    </header>

    <main>

        <form id="formulario-voluntario">
            <!-- Dados pessoais -->
            <fieldset>
                <legend>Seus dados</legend>

                <br>

                <label for="nome">Nome completo</label><br>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    minlength="3"
                    maxlength="100"
                    autocomplete="name"
                    required
                >

                <br><br>

                <label for="email">E-mail</label><br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    maxlength="100"
                    autocomplete="email"
                    required
                >

                <br><br>

                <label for="data_nascimento">Data de nascimento</label><br>

                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    required
                >

                <br><br>

                <label for="cpf">CPF</label><br>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    maxlength="14"
                    inputmode="numeric"
                    placeholder="000.000.000-00"
                    title="Formato exigido: 000.000.000-00"
                    autocomplete="off"
                    required
                >

                <br><br>

                <label for="telefone">Telefone</label><br>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    maxlength="15"
                    autocomplete="tel"
                    required
                >

            </fieldset>

            <br>

            <!-- Endereço -->
            <fieldset>

                <legend>Endereço</legend>

                <br>

                <label for="cep">CEP</label><br>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    required
                    pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="00000-000"
                    maxlength="9"
                    inputmode="numeric"
                    title="Digite o CEP no formato 00000-000"
                    autocomplete="postal-code"
                >

                <br><br>

                <label for="endereco">Endereço</label><br>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    placeholder="Digite seu endereço"
                    maxlength="150"
                    required
                >

                <br><br>

                <label for="cidade">Cidade</label><br>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    placeholder="Digite sua cidade"
                    maxlength="100"
                    autocomplete="address-level2"
                    required
                >

                <br><br>

                <label for="estado">Estado</label><br>

                <input
                    type="text"
                    id="estado"
                    name="estado"
                    placeholder="Digite seu estado"
                    maxlength="50"
                    autocomplete="address-level1"
                    required
                >

            </fieldset>

            <br>

            <!-- Botão -->
            <button type="submit" class="botao">
                Cadastrar-se
            </button>


        </form>

        <section id="cadastros">

            <h2>Voluntários cadastrados</h2>

            <div id="lista-voluntarios"></div>

        </section>


    </main>


    <!-- TOAST -->
    <div id="toast" class="toast">
        Voluntário cadastrado com sucesso!
    </div>

    <footer>
        <p>&copy; 2026 ONG Conecta Futuro - Projeto acadêmico</p>
    </footer>

</body>

</html>
